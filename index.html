<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the dark sky fill the whole phone screen, notch included -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04050a">
  <meta name="description" content="An idle game about the movement of information, from a single bit to a mind.">
  <title>A Meaningful Answer</title>
  <!-- An empty icon, so the browser doesn't go looking for a favicon file -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The whole game is drawn on this one canvas -->
  <canvas id="sky" aria-label="A dark sky. Tap the faint glow in the middle."></canvas>

  <!-- The bit counter sits on top of the canvas as normal text, so it stays crisp -->
  <!-- Only shown when testing with ?speed= in the address -->
  <div id="test-badge" hidden></div>

  <div id="counter">
    <div><span id="count">0</span> <span id="unit">bits</span></div>
    <div id="rate"></div>
    <!-- Short notes ("While you were away...", "Four possible states") fade in here, then out -->
    <div id="note" role="status"></div>
  </div>

  <!-- The Storage or Logic choice: two buttons that sit on the doorways of light drawn in the sky. -->
  <div id="choice" hidden>
    <button type="button" class="path path-storage" data-track="storage">
      <span class="path-door"></span>
      <span class="path-name">Storage</span>
      <span class="path-desc">Keep information. Earn while you're away.</span>
    </button>
    <button type="button" class="path path-logic" data-track="logic">
      <span class="path-door"></span>
      <span class="path-name">Logic</span>
      <span class="path-desc">Transform information. Make every flip count.</span>
    </button>
  </div>

  <!-- The upgrade menu. Hidden until the first upgrade is revealed.
       Wide screens: a column on the right. Phones: a sheet that slides up from the bottom. -->
  <aside id="panel" aria-label="Upgrades">
    <button id="panel-tab" type="button" aria-expanded="false" aria-controls="panel-body">Upgrades</button>
    <div id="panel-body">
      <h2>Upgrades</h2>
      <div id="upgrade-list"></div>
    </div>
  </aside>

  <!-- Plain scripts, loaded in order. Each file adds one global object for the next ones to use. -->
  <script src="js/config.js"></script>
  <script src="js/save.js"></script>
  <script src="js/upgrades.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
